[package]
name = "sanitagent"
version = "0.1.0"
description = "SanitAgent - Desktop Native Prompt Sanitizer HUD"
authors = ["SanitAgent Team"]
edition = "2021"

[lib]
name = "sanitagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
aho-corasick = "1"
rustrict = "0.7"
phonenumber = "0.3"
email_address = "0.2"
card-validate = "2"
iban_validate = "4"
tiktoken-rs = "0.6"
similar = "2.6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel"] }
